name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  backend-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: employee_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run backend tests
        working-directory: backend
        env:
          DB_PASSWORD: root
        run: ./mvnw test


  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build backend JAR
        working-directory: backend
        env:
          DB_PASSWORD: root
        run: ./mvnw clean package -DskipTests

      - name: Build backend Docker image
        run: docker build -t employee-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t employee-frontend:ci ./frontend

      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "employee-backend:ci"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan frontend Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "employee-frontend:ci"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker images
        run: |
          docker tag employee-backend:ci ${{ secrets.DOCKERHUB_USERNAME }}/employee-backend:latest
          docker tag employee-frontend:ci ${{ secrets.DOCKERHUB_USERNAME }}/employee-frontend:latest

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/employee-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/employee-frontend:latest
